<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>Bills Control Center</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">MONTHLY MONEY FLOW</p>
      <h1>Bills Control Center</h1>
    </div>
    <button id="installBtn" class="ghost hidden">Install App</button>
  </header>

  <nav class="tabs" aria-label="Main navigation">
    <button class="tab active" data-view="dashboard">Overview</button>
    <button class="tab" data-view="bills">Bills</button>
    <button class="tab" data-view="funding">Funding</button>
    <button class="tab" data-view="execute">Execute</button>
  </nav>

  <main>
    <section id="dashboard" class="view active">
      <div class="month-row">
        <label>Bill month <input id="billMonth" type="month"></label>
        <span id="saveStatus">Saved locally</span>
      </div>
      <div class="hero-card" id="coverageCard">
        <p id="coverageLabel">Checking coverage…</p>
        <strong id="coverageAmount">$0.00</strong>
        <p id="coverageSub"></p>
      </div>
      <div class="kpi-grid">
        <article><span>Minimum due</span><strong id="kpiMinimum">$0</strong></article>
        <article><span>Planned</span><strong id="kpiPlanned">$0</strong></article>
        <article><span>Actual paid</span><strong id="kpiActual">$0</strong></article>
        <article><span>Funding selected</span><strong id="kpiFunding">$0</strong></article>
      </div>
      <div class="actions">
        <label class="file-button">Import Excel<input id="excelInput" type="file" accept=".xlsx,.xls" hidden></label>
        <button id="exportBtn">Export Excel</button>
        <button id="demoReset" class="ghost">Reset Sample</button>
      </div>
      <article class="panel">
        <div class="panel-title"><h2>Next moves</h2><span id="dueCount"></span></div>
        <div id="nextMoves"></div>
      </article>
    </section>

    <section id="bills" class="view">
      <div class="section-heading">
        <div><p class="eyebrow">STEP 1</p><h2>Update bills</h2></div>
        <button id="addBill">+ Add bill</button>
      </div>
      <div id="billCards" class="card-stack"></div>
    </section>

    <section id="funding" class="view">
      <div class="section-heading">
        <div><p class="eyebrow">STEP 2</p><h2>Choose the money</h2></div>
        <button id="addSource">+ Add source</button>
      </div>
      <div class="funding-summary">
        <span>Available for bills <strong id="availableTotal">$0</strong></span>
        <button id="autoFund">Auto-fill funding</button>
      </div>
      <div id="fundingCards" class="card-stack"></div>
    </section>

    <section id="execute" class="view">
      <div class="section-heading">
        <div><p class="eyebrow">STEP 3</p><h2>Transfer, pay, done</h2></div>
        <button id="markAllPaid">Mark planned as paid</button>
      </div>
      <article class="panel">
        <div class="panel-title"><h2>Transfers</h2></div>
        <div id="transferList"></div>
      </article>
      <article class="panel">
        <div class="panel-title"><h2>Payments</h2></div>
        <div id="paymentList"></div>
      </article>
    </section>
  </main>

  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <div class="dialog-head"><h2 id="dialogTitle">Edit</h2><button value="cancel" class="icon-btn">×</button></div>
      <div id="dialogFields"></div>
      <div class="dialog-actions"><button value="cancel" class="ghost">Cancel</button><button id="dialogSave" value="default">Save</button></div>
    </form>
  </dialog>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
